name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-release.txt
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag and VERSION do not match'
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test, build and package
        shell: pwsh
        run: .\release.ps1 -PythonExe (Get-Command python).Source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GuildTracker-${{ env.RELEASE_VERSION }}-windows-x64
          path: release/${{ env.RELEASE_VERSION }}/
          if-no-files-found: error
          compression-level: 0
      - name: Create draft release for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $folder = "release/$env:RELEASE_VERSION"
          gh release view $env:GITHUB_REF_NAME --json isDraft *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'This release already exists; refusing to replace its assets. Use a new version.'
          }
          $assets = @(
            "$folder/GuildTracker.exe",
            "$folder/GuildTracker-$env:RELEASE_VERSION-windows-x64.zip",
            "$folder/SHA256SUMS.txt",
            "$folder/build-info.json",
            "$folder/release-notes.md"
          )
          gh release create $env:GITHUB_REF_NAME @assets --draft --verify-tag `
            --title "Guild Tracker $env:RELEASE_VERSION" --notes-file "$folder/release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
